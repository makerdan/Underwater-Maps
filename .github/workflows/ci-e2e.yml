name: E2E — Playwright (main)

# Full Playwright e2e suite against a real Postgres + api-server + Vite dev
# server stack. Runs on push to main only (not PRs): the suite takes ~20–25
# minutes, which is too slow for PR gating — the immediate win is catching
# regressions automatically after every merge instead of spending an agent
# session on post-merge validation. workflow_dispatch allows manual runs.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright e2e suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bathyscan
          POSTGRES_PASSWORD: bathyscan
          POSTGRES_DB: bathyscan_e2e
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before any step runs.
        options: >-
          --health-cmd "pg_isready -U bathyscan -d bathyscan_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Service container is published on the runner's localhost:5432.
      DATABASE_URL: postgres://bathyscan:bathyscan@localhost:5432/bathyscan_e2e
      CI: 'true'
      # ── Clerk keys (dummy, format-valid) ─────────────────────────────────
      # The e2e suite never authenticates through Clerk — the api-server runs
      # with E2E_AUTH_BYPASS=1 and the frontend with VITE_DEV_AUTH_BYPASS=1
      # (both wired inside playwright.config.ts webServer commands). But
      # app.ts mounts @clerk/express clerkMiddleware unconditionally, and
      # authenticateRequest throws on every request (500s, including
      # /api/healthz) when no secret key is configured. These dummies satisfy
      # the middleware; requests without a Clerk session token are treated as
      # signed-out with no network call, and the bypass header then supplies
      # the test identity. pk decodes to "clerk.example.com$".
      CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci-dummy-never-used

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # bag_parser.py (spawned by the api-server for .bag uploads — exercised
      # by file-upload-bag-nmea-gpx and null-cell-terrain specs) imports
      # h5py, numpy, and pyproj. On Replit these live in .pythonlibs; in CI
      # a plain user install is on python3's default path.
      - name: Set up Python 3.11 (BAG parser subprocess deps)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install BAG parser Python deps
        run: pip install "numpy>=1.26,<3" h5py pyproj

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libs (emit .d.ts for workspace packages)
        run: pnpm run typecheck:libs

      # WHY push --force, not migrate:
      #   The migration journal cannot bootstrap a fresh database:
      #   0000_baseline.sql is an empty stub and the real schema baseline
      #   lives in 0012_schema_baseline_sync, which the journal orders AFTER
      #   migrations that reference those tables (0001 deletes from "markers"
      #   before any migration creates it). `drizzle-kit migrate` therefore
      #   always exits 1 against the empty CI service container. This matches
      #   local dev, where post-merge.sh uses push for the same reason.
      #   `push --force` derives DDL directly from the Drizzle schema, which
      #   is exactly what a from-scratch e2e database needs.
      - name: Create database schema (drizzle-kit push)
        run: pnpm --filter @workspace/db run push-force

      # --with-deps installs the OS-level shared libraries Chromium needs on
      # ubuntu-latest (the replit.nix package list serves this purpose
      # locally). REPLIT_PLAYWRIGHT_CHROMIUM_EXECUTABLE is unset here, so
      # playwright.config.ts falls through to this managed browser.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Pre-build so the webServer's inline build:e2e safety net is a fast
      # no-op and its 60 s startup timeout is spent on boot, not bundling.
      - name: Build api-server e2e bundle
        run: DIST_DIR=dist-e2e pnpm --filter @workspace/api-server run build:e2e

      # playwright.config.ts starts both servers (api-server with
      # E2E_AUTH_BYPASS=1 / E2E_BYPASS_SECRET=e2e-playwright-secret /
      # DB_CONNECTION_TIMEOUT_MS=30000 / SETTINGS_MUTATION_MAX=600, and the
      # Vite dev server with VITE_DEV_AUTH_BYPASS=1) and waits on their
      # health URLs before running specs. Playwright is invoked directly
      # rather than via `pnpm run test:e2e`: the validation-lock and
      # port-sweep wrappers in that script are Replit-workspace machinery
      # with no concurrent holders on a fresh runner, and direct invocation
      # lets us pass --grep-invert and the html reporter cleanly.
      #
      # ── Exclusions ────────────────────────────────────────────────────
      # The 9 known pre-existing failures this workflow originally planned
      # to exclude (find-data load, live-mode, gps-trail, follow-handoff,
      # TOPO badge — see .agents/memory/full-e2e-known-failures.md) were all
      # fixed on 2026-07-21 and confirmed green on 2026-07-30, so they run
      # normally here.
      #
      # "signed upload" (catch-journal photo happy path) is excluded because
      # it PUTs a photo to a real signed object-storage URL. Object storage
      # is served by the Replit sidecar (PRIVATE_OBJECT_DIR /
      # PUBLIC_OBJECT_SEARCH_PATHS), which does not exist on a GitHub
      # runner, so /api/catch-photos/upload-url can only 500 here. The
      # test stays in the local suite, where the sidecar is available.
      - name: Run Playwright e2e suite
        run: >-
          pnpm exec playwright test
          --reporter=list,html
          --grep-invert "signed upload"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
