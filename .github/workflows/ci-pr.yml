name: CI — Typecheck, Lint & Unit Suites

# ── PR gate trigger: pull_request_target ─────────────────────────────────────
# This workflow uses pull_request_target (not pull_request) so that runs for
# first-time / unknown contributors can be gated behind a maintainer approval
# via the `pr-checks` environment protection rule.
#
# The approval gate lives in a SEPARATE `gate` job that only runs for PR
# authors without prior merged contributions. Environment "Required
# reviewers" rules apply to every run of a job that references the
# environment — GitHub does not exempt established contributors — so putting
# `environment: pr-checks` on the main `ci` job would force manual approval
# for ALL PRs. Splitting the gate out keeps established contributors on
# fully automatic CI while unknown authors wait for a maintainer.
#
# Security posture for the `ci` job (which executes PR-head code):
#   • permissions is pinned to contents: read — the GITHUB_TOKEN handed to
#     this run cannot write to the repository even though pull_request_target
#     normally grants a write token.
#   • The checkout step uses persist-credentials: false, so the PR's code
#     never sees a usable token on disk.
#   • This workflow references no repository secrets (the e2e workflows use
#     hardcoded dummy Clerk keys; none appear here).
on:
  push:
  pull_request_target:

jobs:
  # ── Approval gate — first-time / unknown contributors only ────────────────
  # The `pr-checks` environment must be created in GitHub Settings →
  # Environments with "Required reviewers" set to maintainers. Once
  # configured, this job (and therefore the whole run, via `needs:`) waits
  # for a maintainer's approval before any PR-head code executes for an
  # unknown author. Until the environment is configured in Settings, GitHub
  # auto-creates it with no protection rules and the gate is a harmless
  # pass-through.
  gate:
    name: Approval gate (first-time / unknown contributors)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only PR runs whose author has NO prior merged contributions enter the
    # protected environment. author_association values OWNER / MEMBER /
    # COLLABORATOR (standing access) and CONTRIBUTOR (has prior merged PRs)
    # skip the gate entirely, so regular contributors keep automatic CI.
    # push events never match and also skip the gate.
    if: >-
      github.event_name == 'pull_request_target' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'),
                github.event.pull_request.author_association)
    environment: pr-checks
    # This job runs no repository code and needs no token at all.
    permissions: {}
    steps:
      - name: Maintainer approval granted
        run: echo "pr-checks environment approval granted — proceeding to CI."

  ci:
    name: Static checks + unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 35

    needs: gate
    # Run when the gate PASSED (unknown author, maintainer approved) or was
    # SKIPPED (push event, or PR from an established contributor). Never run
    # when the gate failed or the approval was rejected/cancelled.
    if: >-
      always() &&
      (needs.gate.result == 'success' || needs.gate.result == 'skipped')

    # Restrict the GITHUB_TOKEN: pull_request_target grants write permissions
    # by default, which untrusted PR code must never receive.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # pull_request_target checks out the BASE branch by default, which
          # would make this gate a no-op (it would test main, not the PR).
          # Check out the PR head explicitly — safe here because the job's
          # GITHUB_TOKEN is read-only, credentials are not persisted, no
          # secrets are referenced, and unknown-author runs are held behind
          # the `gate` job's pr-checks environment approval.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libs (emit .d.ts for workspace packages)
        run: pnpm run typecheck:libs

      # ── Portable validation guards ──────────────────────────────────────────
      # The order below mirrors scripts/validation-steps.mjs: fast-tier guards,
      # then standard-tier checks, then full-tier static checks. Unit suites
      # follow separately and are not re-run through `pnpm run test:unit`.
      #
      # Intentional GitHub exclusions are enforced by
      # scripts/check-runner-step-sync.mjs:
      #   • check:skill-mirror-sync      reads gitignored .local/custom_skills/
      #   • fix:*gate-stubs              writes agent-local .local/tasks/
      #   • check:stale-lock-cleanup     exercises Replit validation-lock state
      #   • audit:marker-bbox            needs a live development database
      #
      # The non-mutating failure- and regression-gate checks run via `verify`;
      # --skip-if-no-task makes them safe in a clean GitHub checkout.
      # check:fixture-freshness and check:port-drift run in the separate
      # pull-request Drift Detection workflow, which provides the Python
      # fixture-generator prerequisites. Those workflow tokens are part of the
      # same enforced parity contract.

      - name: typecheck
        run: pnpm run typecheck

      - name: lint
        run: pnpm run lint

      - name: 'check:lock-skill-sync'
        run: pnpm run check:lock-skill-sync

      - name: 'check:failure-gate-zip'
        run: pnpm run check:failure-gate-zip

      - name: 'check:poe-setup-zip'
        run: pnpm run check:poe-setup-zip

      - name: 'check:port-authority-zip'
        run: pnpm run check:port-authority-zip

      - name: 'check:port-authority-heavy-zip'
        run: pnpm run check:port-authority-heavy-zip

      - name: 'check:tier-lock'
        run: pnpm run check:tier-lock

      - name: 'check:root-relative-api'
        run: pnpm run check:root-relative-api

      - name: 'check:deps-suppression'
        run: pnpm run check:deps-suppression

      - name: 'check:duplicate-hooks-registry'
        run: pnpm run check:duplicate-hooks-registry

      - name: 'check:runner-step-sync'
        run: pnpm run check:runner-step-sync

      - name: 'check:ci-validation-parity-skill'
        run: pnpm run check:ci-validation-parity-skill

      - name: 'check:skill-compression-contract'
        run: pnpm run check:skill-compression-contract

      - name: 'verify: failure-gate + regression-guard'
        run: pnpm run verify

      - name: 'check:failure-gate-self-test'
        run: pnpm run check:failure-gate-self-test

      - name: 'check:pre-commit-self-test'
        run: pnpm run check:pre-commit-self-test

      - name: 'check:regression-guard-self-test'
        run: pnpm run check:regression-guard-self-test

      - name: 'check:skip-count'
        run: pnpm run check:skip-count

      - name: 'check:testdb-schema-drift'
        run: pnpm run check:testdb-schema-drift

      - name: 'check:api-route-schema-drift'
        run: pnpm run check:api-route-schema-drift

      - name: 'check:catalog-facade-mocks'
        run: pnpm run check:catalog-facade-mocks

      - name: 'check:runbutton-noop'
        run: pnpm run check:runbutton-noop

      - name: 'check:docs-stale'
        run: pnpm run check:docs-stale

      - name: 'check:catalog-coverage'
        run: pnpm run check:catalog-coverage

      - name: 'check:schema-stale'
        run: pnpm run check:schema-stale

      - name: 'check:font-scale'
        run: pnpm run check:font-scale

      # ── Full-tier static checks ─────────────────────────────────────────────
      # Fixture freshness and port-drift are intentionally covered by
      # drift-detection.yml (see the portability note above).
      - name: 'check:e2e-user-ids'
        run: pnpm run check:e2e-user-ids

      - name: 'check:e2e-cjs-globals'
        run: pnpm run check:e2e-cjs-globals

      - name: 'check:e2e-panel-collapse'
        run: pnpm run check:e2e-panel-collapse

      - name: 'check:ports'
        run: pnpm run check:ports

      - name: 'check:production-build'
        run: pnpm run check:production-build

      - name: 'check:audit'
        run: pnpm run check:audit

      - name: 'check:bare-pino-http-mock'
        run: pnpm run check:bare-pino-http-mock

      - name: 'check:trip-window-raw-units'
        run: pnpm run check:trip-window-raw-units

      # ── Unit suites ─────────────────────────────────────────────────────────
      # api-server is sharded exactly like the local test:unit script (two
      # sequential vitest shards with an 8 GB heap). No run-with-timeout.mjs
      # wrapper is used for the shards — the job's timeout-minutes is the budget.

      - name: 'test:unit — api-server (shard 1/2)'
        working-directory: artifacts/api-server
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec vitest run --shard=1/2

      - name: 'test:unit — api-server (shard 2/2)'
        working-directory: artifacts/api-server
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec vitest run --shard=2/2

      - name: 'test:unit — api-zod'
        run: pnpm --filter @workspace/api-zod run test:unit

      - name: 'test:unit — lib/db'
        run: pnpm --filter @workspace/db run test:unit

      - name: 'test:unit — lib/poe'
        run: pnpm --filter @workspace/poe run test:unit

      - name: 'test:unit — validation scripts'
        run: pnpm --filter @workspace/scripts run test:unit
