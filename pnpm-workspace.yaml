packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@tanstack/react-virtual': ^3.14.9
  '@types/node': ^25.3.3
  '@types/react': 19.2.14
  '@types/react-dom': ^19.2.0
  # Build-critical toolchain: pinned exactly (no caret) because floating minor
  # bumps have silently broken the build before — @vitejs/plugin-react 5.2.0
  # stopped applying the JSX transform under vitest (297 "React is not defined"
  # failures). Bump vite / @vitejs/plugin-react / vitest deliberately, together,
  # and re-run the jsx-sensitive unit tests + testHelpers.bundle.test.ts.
  '@vitejs/plugin-react': 5.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  # vite pinned (see toolchain note above); bathyscan pins vite 8.x directly
  # in its own package.json.
  vite: 7.3.6
  # vitest pinned (see toolchain note above); consumed via catalog: by all
  # test-bearing packages. Companion packages (@vitest/coverage-v8, @vitest/ui)
  # must stay on the same major.minor.patch as vitest — a major mismatch
  # produces unmet peer warnings and can silently break coverage runs / the UI.
  vitest: 3.2.7
  '@vitest/coverage-v8': 3.2.7
  '@vitest/ui': 3.2.7
  wouter: ^3.10.0
  zod: 3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # ══════════════════════════════════════════════════════════════════════════════
  # ALL pnpm overrides live here — in pnpm-workspace.yaml — and ONLY here.
  # DO NOT add overrides to package.json (pnpm.overrides): package.json wins
  # silently over this file for the same key, so a workspace.yaml change has no
  # effect until package.json is also updated — a maintenance trap.
  # ══════════════════════════════════════════════════════════════════════════════
  #
  # ── Security overrides (2025-07-17, updated 2026-08-16) ─────────────────────
  # Intentionally accepted low-severity findings (not overridden):
  #   • esbuild >=0.27.3 <0.28.1 (GHSA-g7r4-m6w7-qqqr) via vite transitive path:
  #     arbitrary file read on Windows dev server only; exact vite pin in catalog
  #     prevents bumping esbuild under vite; Linux-only deployment is not affected.
  #     api-server direct esbuild dep is bumped to ^0.28.1 in its package.json.
  # All moderate/high/critical findings are resolved via the overrides below.
  # @babel/core <=7.29.0 (GHSA-4x5r-pxfx-6jf8): sourceMappingURL arbitrary file
  # read via eslint-plugin-react-hooks; dev/lint toolchain only. Overridden to
  # close the finding proactively; remove once eslint-plugin-react-hooks bumps its
  # own @babel/core peer to >=7.29.6.
  '@babel/core': '^7.29.6'
  # brace-expansion: ReDoS in path glob patterns
  brace-expansion@1: '^1.1.17'
  brace-expansion@2: '^2.1.3'
  brace-expansion@5: '^5.0.8'
  # tar@7: path traversal / arbitrary file write
  tar@7: '^7.5.21'
  # fast-uri: prototype pollution
  fast-uri: '^3.1.4'
  # body-parser: ReDoS in content-type parsing
  body-parser: '^2.3.0'
  # js-yaml <=4.1.1: quadratic DoS in merge-key via orval; build-only exposure.
  # js-yaml 4.3.0: quadratic CPU in !!omap (GHSA-5p4m-2wfm-xmqj, CVE-2026-59870);
  # patched in 4.3.1. Keyed as js-yaml@4 to stay in the 4.x series and avoid
  # v5.x which breaks orval ESM imports (see memory: js-yaml-override-breaks-orval).
  js-yaml@4: '4.3.1'
  # esbuild <0.28.1: arbitrary file read on dev server (GHSA-g7r4-m6w7-qqqr);
  # applied here for non-vite paths (api-server direct dep handled in its package.json).
  esbuild@<0.28.1: '^0.28.1'
  # uuid <11.1.1: credential exposure via predictable UUIDs
  uuid@<11.1.1: '^11.1.1'
  # nanoid: insecure randomness in older versions
  nanoid: '3.3.18'
  # Security: pin vulnerable transitive deps to patched versions (2025-07-17)
  # form-data <4.0.6 / <2.5.6: CRLF injection via @types/supertest and @google-cloud/storage chains
  form-data: '>=4.0.6'
  # linkify-it <=5.0.0: quadratic scan loop via orval->typedoc->markdown-it; build-only exposure
  linkify-it: '>=5.0.1'
  # markdown-it <=14.1.1: quadratic DoS in smartquotes via orval->typedoc; build-only exposure
  markdown-it: '>=14.2.0'
  # undici: cannot override to >=7.28.0 — jsdom 29.1.1 hard-requires internal
  # paths removed in 7.28.0 (lib/handler/wrap-handler.js), breaking all Vitest tests.
  # Documented as exception in check-audit.mjs + security-audit-exceptions.md.
  # vite <=7.3.4: server.fs.deny bypass + NTLMv2 hash disclosure on Windows;
  # bumped to ^7.3.5 in catalog above for bathyscan; override also covers api-server->vitest->vite path
  vite: '>=7.3.5'
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
